<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>API Client Demo</p>
  </header>

  <main>
    <section>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" aria-live="polite"></p>
    </section>

    <section>
      <h2>Create a note</h2>

      <form id="note-form">
        <div>
          <label for="title-input">Title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
          >
        </div>

        <div>
          <label for="body-input">Body</label>
          <textarea
            id="body-input"
            name="body"
            rows="5"
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section>
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
